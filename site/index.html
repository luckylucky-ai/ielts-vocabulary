<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IELTS Topic Studio · 话题式雅思备考</title>
    <link rel="stylesheet" href="./styles.css?v=2161fe23" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="话题导航">
        <div class="brand">
          <span class="brand-mark">IELTS</span>
          <div>
            <h1>Topic Studio</h1>
            <p>话题式备考：词汇 · 阅读 · 写作</p>
          </div>
        </div>

        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="输入 topic / word / 中文" autocomplete="off" />
        </label>

        <button class="exam-entry" id="examEntry" type="button">
          <span>单词考试</span>
          <em id="examEntryBadge" hidden></em>
        </button>

        <button class="exam-entry reading-entry" id="readingEntry" type="button" hidden>
          <span>阅读练习</span>
          <em id="readingEntryBadge"></em>
        </button>

        <button class="exam-entry essay-entry" id="essayEntry" type="button" hidden>
          <span>写作范文</span>
          <em id="essayEntryBadge"></em>
        </button>

        <nav class="topic-nav" aria-label="选择话题">
          <p class="topic-nav-label">话题</p>
          <div class="topic-list" id="topicList"></div>
        </nav>

        <div class="stats" id="stats"></div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div>
            <p class="eyebrow">Interactive gallery</p>
            <h2 id="pageTitle">雅思话题词汇卡片</h2>
          </div>
          <div class="voice-control">
            <label for="voiceSelect">发音</label>
            <select id="voiceSelect" aria-label="选择发音"></select>
          </div>
        </div>


        <div class="gallery" id="gallery" aria-live="polite"></div>
      </section>
    </main>

    <div class="exam-backdrop" id="examBackdrop" hidden></div>
    <aside class="exam-drawer" id="examDrawer" aria-label="单词考试" aria-hidden="true">
      <section class="exam-panel" id="examPanel">
        <div class="exam-head">
          <div>
            <p class="eyebrow">Vocabulary exam</p>
            <h3>话题单词考试</h3>
          </div>
          <div class="exam-head-actions">
            <div class="exam-score" id="examScore">未开始</div>
            <button class="exam-close" id="examClose" type="button" aria-label="关闭考试面板">×</button>
          </div>
        </div>

        <div class="exam-body" id="examBody">
            <div class="exam-controls">
              <label>
                <span>形式</span>
                <select id="examMode">
                  <option value="meaning">看中文选英文</option>
                  <option value="pronunciation">听读音选中文</option>
                  <option value="spelling">拼写填空</option>
                  <option value="mixed">混合模式</option>
                </select>
              </label>
              <label>
                <span>题数</span>
                <select id="examCount">
                  <option value="10">10 题</option>
                  <option value="15">15 题</option>
                  <option value="20">20 题</option>
                  <option value="all">全部</option>
                </select>
              </label>
              <button class="exam-start" id="examStart" type="button">开始考试</button>
            </div>

            <div class="exam-board" id="examBoard">
              <p>选择一个话题后开始，系统会从该话题抽词。</p>
            </div>

            <div class="mistake-book" id="mistakeBook" aria-label="错题本">
              <div class="mistake-head">
                <div>
                  <p class="eyebrow">Mistake book</p>
                  <h4>错题本</h4>
                </div>
                <div class="mistake-actions">
                  <button class="mistake-retake" id="mistakeRetake" type="button">重考错题</button>
                  <button class="mistake-clear" id="mistakeClear" type="button">清空</button>
                </div>
              </div>
              <div class="mistake-filter" id="mistakeFilter" role="group" aria-label="错题范围">
                <button type="button" data-filter="topic">当前话题</button>
                <button type="button" data-filter="all">全部话题</button>
              </div>
              <div class="mistake-list" id="mistakeList"></div>
            </div>
          </div>
      </section>
    </aside>

    <div class="word-tooltip" id="wordTooltip" role="tooltip"></div>
    <div class="image-modal" id="imageModal" aria-hidden="true">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭放大卡片">×</button>
      <button class="modal-nav modal-prev" id="modalPrev" type="button" aria-label="上一张">‹</button>
      <button class="modal-nav modal-next" id="modalNext" type="button" aria-label="下一张">›</button>
      <div class="modal-card-view">
        <div class="modal-stage" id="modalStage">
          <img id="modalImage" alt="" />
          <div class="magnifier" id="magnifier" aria-hidden="true"></div>
          <div class="modal-word-zoom" id="modalWordZoom" aria-live="polite">
            <strong></strong>
            <span></span>
          </div>
        </div>
        <aside class="modal-study-panel" aria-label="卡片单词">
          <div class="modal-caption" id="modalCaption"></div>
          <div class="modal-words" id="modalWords"></div>
        </aside>
      </div>
    </div>
    <div class="reading-modal" id="readingModal" aria-hidden="true">
      <button class="modal-close" id="readingClose" type="button" aria-label="关闭阅读练习">×</button>
      <div class="reading-view">
        <article class="reading-passage" id="readingPassage"></article>
        <aside class="reading-panel">
          <div class="reading-panel-head">
            <div>
              <p class="eyebrow">Reading practice</p>
              <h3 id="readingHeading">阅读理解</h3>
            </div>
            <div class="reading-score" id="readingScore">未提交</div>
          </div>
          <div class="reading-questions" id="readingQuestions"></div>
          <div class="reading-actions">
            <button class="exam-start" id="readingSubmit" type="button">提交批改</button>
            <button class="mistake-clear" id="readingReset" type="button">重做</button>
          </div>
        </aside>
      </div>
    </div>
    <div class="exam-backdrop" id="essayListBackdrop" hidden></div>
    <aside class="exam-drawer" id="essayListDrawer" aria-label="写作范文" aria-hidden="true">
      <section class="exam-panel">
        <div class="exam-head">
          <div>
            <p class="eyebrow">Writing Task 2</p>
            <h3>写作范文</h3>
          </div>
          <div class="exam-head-actions">
            <button class="exam-close" id="essayListClose" type="button" aria-label="关闭">×</button>
          </div>
        </div>
        <div class="essay-list" id="essayList"></div>
      </section>
    </aside>

    <div class="reading-modal" id="essayModal" aria-hidden="true">
      <button class="modal-close" id="essayClose" type="button" aria-label="关闭范文">×</button>
      <div class="reading-view">
        <article class="reading-passage" id="essayPassage"></article>
        <aside class="reading-panel">
          <div class="reading-panel-head">
            <div>
              <p class="eyebrow">Writing Task 2</p>
              <h3 id="essayHeading">范文精读</h3>
            </div>
            <div class="reading-score" id="essayType"></div>
          </div>
          <div class="reading-questions" id="essayPanel"></div>
        </aside>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./data.js?v=4ba843ff"></script>
    <script src="./app.js?v=745a8951"></script>
  </body>
</html>
